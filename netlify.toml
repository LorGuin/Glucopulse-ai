[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Mantiene las llamadas del frontend a /api/groq-vision y /api/groq-chat
# funcionando sin tocar el código del cliente: Netlify las redirige a las
# funciones serverless reales.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
