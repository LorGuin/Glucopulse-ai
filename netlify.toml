[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Mantiene las llamadas del frontend a /api/groq-vision y /api/groq-chat
# funcionando sin tocar el código del cliente: Netlify las redirige a las
# funciones serverless reales.
# PWA: el service worker y el manifest no se cachean, así cada deploy
# llega enseguida a las apps instaladas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
